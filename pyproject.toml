[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "dnslint"
version = "0.1.0"
description = "A strict-by-default linter for DNS zone files"
readme = "README.md"
requires-python = ">=3.9"
license = { text = "MIT" }
authors = [{ name = "karen-s1994" }]

[project.scripts]
dnslint = "dnslint.cli:main"

[tool.setuptools.packages.find]
include = ["dnslint*"]
